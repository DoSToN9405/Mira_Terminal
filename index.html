<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>⛏️ MIRA TERMINAL v9.1</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0a0c10; color:#00ff88; font-family:'Courier New',monospace; padding:10px; height:100vh; display:flex; flex-direction:column; }
    #terminal { background:#0d1117; border:1px solid #00ff8833; border-radius:12px; padding:14px; flex:1; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 0 40px #00ff8811; }
    #output { flex:1; overflow-y:auto; padding:4px 0; font-size:14px; line-height:1.5; white-space:pre-wrap; word-break:break-all; }
    #output::-webkit-scrollbar { width:6px; }
    #output::-webkit-scrollbar-track { background:#0d1117; }
    #output::-webkit-scrollbar-thumb { background:#00ff8844; border-radius:3px; }
    .prompt-line { display:flex; align-items:center; gap:8px; margin-top:6px; border-top:1px solid #00ff8811; padding-top:6px; }
    .prompt { color:#00ff88; font-weight:bold; }
    #input { background:transparent; border:none; color:#00ff88; font-family:'Courier New',monospace; font-size:14px; flex:1; outline:none; caret-color:#00ff88; }
    #input::selection { background:#00ff8844; }
    .log-entry { border-bottom:1px solid #00ff8811; padding:2px 0; }
    .log-entry .time { color:#446688; margin-right:10px; }
    .highlight { color:#ffd740; }
    .error { color:#ff5252; }
    .success { color:#00e676; }
    .info { color:#64b5f6; }
    .muted { color:#6a7f9a; }
    .status-led { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
    .led-green { background:#00e676; box-shadow:0 0 12px #00e676; }
    .led-red { background:#ff5252; box-shadow:0 0 12px #ff5252; }
  </style>
</head>
<body>
<div id="terminal">
  <div style="display:flex;justify-content:space-between;border-bottom:1px solid #00ff8833;padding-bottom:6px;margin-bottom:6px;flex-wrap:wrap;">
    <span>⛏️ MIRA TERMINAL v9.1 — <span id="status-indicator" class="status-led led-red"></span><span id="status-text">OFFLINE</span></span>
    <span class="muted">pid: <span id="pid">-</span> | uptime: <span id="uptime">0s</span></span>
  </div>
  <div id="output"></div>
  <div class="prompt-line">
    <span class="prompt">mira@miner:~$</span>
    <input type="text" id="input" autofocus spellcheck="false" autocomplete="off">
  </div>
</div>
<script>
  const TG = window.Telegram.WebApp;
  TG.expand();

  const API_BASE = 'https://mira.networkk.workers.dev';
  const CONFIG = {
    masterAddress: 'EQCRF0wncfdqLCo97O2P1M7IYixTrh3fGVTscsERyj0gmegA',
    holderAddress: 'UQBr9K-6-Sbu7Dk8ZOkIgQfdbmFbEpuuGRkmZa1IAzRu8HAb',
    stonfiSwap: 'https://app.ston.fi/swap?output=EQCRF0wncfdqLCo97O2P1M7IYixTrh3fGVTscsERyj0gmegA',
    stonfiPool: 'https://app.ston.fi/pools/EQCRF0wncfdqLCo97O2P1M7IYixTrh3fGVTscsERyj0gmegA'
  };

  const state = {
    mining: false,
    hashrate: 0,
    totalHashes: 0,
    blocks: 0,
    pending: 0,
    totalReward: 0,
    difficulty: 1,
    power: 0,
    userWallet: null,
    refCode: 'MIRA' + Math.random().toString(36).substring(2,8).toUpperCase(),
    startTime: Date.now(),
    pid: Math.floor(Math.random() * 9000 + 1000),
    ecoMode: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent),
    banned: false
  };

  let miningInterval = null;
  let isMiningNow = false;
  const output = document.getElementById('output');
  const input = document.getElementById('input');

  function log(msg, type='info') {
    const div = document.createElement('div');
    div.className = 'log-entry';
    const time = new Date().toLocaleTimeString();
    const cls = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'highlight' ? 'highlight' : 'info';
    div.innerHTML = `<span class="time">[${time}]</span><span class="${cls}">${msg}</span>`;
    output.appendChild(div);
    output.scrollTop = output.scrollHeight;
    if (output.children.length > 300) output.removeChild(output.firstChild);
  }

  async function sha256(message) {
    const enc = new TextEncoder();
    const buf = await crypto.subtle.digest('SHA-256', enc.encode(message));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function apiCall(endpoint, data = {}) {
    try {
      const res = await fetch(`${API_BASE}/${endpoint}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          ...data,
          initData: TG.initData || ''
        })
      });
      return await res.json();
    } catch (e) {
      log(`⚠️ API error: ${e.message}`, 'error');
      return null;
    }
  }

  async function fetchBalances() {
    const data = await apiCall('balance', { address: CONFIG.holderAddress });
    if (data) {
      log(`💰 TON: ${data.ton || '0'}`, 'info');
      log(`🪙 MIRA: ${data.mira || '0'}`, 'highlight');
    }
    const mine = await apiCall('balance/me', {});
    if (mine) {
      state.pending = mine.pending || 0;
      log(`⚖️ Мой баланс: ${state.pending.toFixed(2)} MIRA`, 'highlight');
    }
  }

  async function fetchPoolState() {
    const data = await apiCall('pool', {});
    if (data) {
      log(`⛏️ ПУЛ: блок #${data.blocks} | сложность ${data.difficulty}`, 'info');
      state.difficulty = data.difficulty;
    }
  }

  async function fetchTop() {
    const data = await apiCall('top', {});
    if (data && data.top) {
      log('🏆 ТОП МАЙНЕРОВ:', 'highlight');
      if (!data.top.length) log('  Пока нет майнеров', 'muted');
      else data.top.forEach((item, i) => {
        const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${item.rank}`;
        log(`  ${medal} ${item.id.substring(0,10)}... — ${item.blocks}`, i < 3 ? 'highlight' : 'info');
      });
    }
  }

  async function mineBlock() {
    try {
      const ch = await apiCall('challenge', {});
      if (!ch || !ch.salt) {
        if (ch?.error?.includes('Too many')) {
          log('⏳ Rate limit, пауза 10s', 'muted');
          await new Promise(r => setTimeout(r, 10000));
        } else {
          log(`⚠️ Challenge: ${ch?.error || 'failed'}`, 'error');
          await new Promise(r => setTimeout(r, 3000));
        }
        return;
      }

      const { salt, difficulty } = ch;
      state.difficulty = difficulty;
      const target = difficulty * 100000;
      const threshold = Math.floor(0xFFFFFFFF / target);

      let hashes = 0;
      const start = performance.now();
      const maxIter = state.ecoMode ? 5000 : 50000;
      let foundNonce = null;

      for (let i = 0; i < maxIter; i++) {
        const nonce = `${salt}_${i}_${Date.now()}`;
        const hex = await sha256(salt + nonce);
        hashes++;
        state.totalHashes++;
        const hashValue = parseInt(hex.substring(0, 8), 16);
        if (hashValue < threshold) {
          foundNonce = nonce;
          break;
        }
      }

      const elapsed = (performance.now() - start) / 1000;
      state.hashrate = state.hashrate * 0.6 + (hashes / elapsed / 1000000) * 0.4;
      state.power = Math.floor(state.hashrate * 1.2 + (state.ecoMode ? 10 : 30));

      if (!foundNonce) {
        log('🔍 Nonce не найден в этом раунде', 'muted');
        saveState();
        return;
      }

      const res = await apiCall('submit', { nonce: foundNonce, difficulty: difficulty });
      if (res?.success) {
        state.blocks = res.block;
        state.pending = res.balance || (state.pending + (res.reward || 0));
        state.difficulty = res.difficulty || difficulty;
        log(`⛏️ БЛОК #${state.blocks} | +${res.reward} MIRA | Слож. ${state.difficulty}`, 'success');
      } else if (res) {
        const code = res.code || '';
        if (code === 'DIFF_MISMATCH') {
          log(`↻ Сложность устарела, обновляем (${res.expected})`, 'muted');
          state.difficulty = res.expected;
        } else if (code === 'TOO_FAST') {
          log(`⏳ ${res.error}`, 'muted');
          await new Promise(r => setTimeout(r, 5000));
        } else if (code === 'NO_CHALLENGE') {
          log('↻ Challenge истёк, повторяем', 'muted');
        } else if (code === 'RATE_LIMIT') {
          log('⏳ Rate limit, пауза 10s', 'muted');
          await new Promise(r => setTimeout(r, 10000));
        } else {
          log(`❌ ${res.error}`, 'error');
        }
      }

      document.getElementById('uptime').textContent = Math.floor((Date.now() - state.startTime) / 1000) + 's';
      saveState();
    } catch (e) {
      log(`⚠️ Mine error: ${e.message}`, 'error');
      await new Promise(r => setTimeout(r, 3000));
    }
  }

  function startMiningLoop() {
    if (state.banned) { log('❌ Аккаунт заблокирован', 'error'); return; }
    if (miningInterval) clearInterval(miningInterval);
    const interval = state.ecoMode ? 5000 : 1500;
    miningInterval = setInterval(async () => {
      if (!state.mining || state.banned) return;
      if (isMiningNow) return;
      isMiningNow = true;
      try { await mineBlock(); } finally { isMiningNow = false; }
    }, interval);
  }

  const commands = {
    help() {
      log('КОМАНДЫ:', 'highlight');
      ['start','stop','status','claim','wallet','setwallet','eco','pool','top','ref','buy','stonfi','clear','exit'].forEach(c => log(`  ${c}`, 'info'));
    },
    start() {
      if (state.banned) { log('❌ Аккаунт заблокирован', 'error'); return; }
      if (state.mining) { log('❌ Уже запущен', 'error'); return; }
      state.mining = true;
      document.getElementById('status-indicator').className = 'status-led led-green';
      document.getElementById('status-text').textContent = 'MINING';
      log(`⛏️ Майнинг запущен (${state.ecoMode?'ECO':'PRO'})`, 'success');
      startMiningLoop();
    },
    stop() {
      if (!state.mining) { log('❌ Не запущен', 'error'); return; }
      state.mining = false;
      document.getElementById('status-indicator').className = 'status-led led-red';
      document.getElementById('status-text').textContent = 'OFFLINE';
      if (miningInterval) { clearInterval(miningInterval); miningInterval = null; }
      log('⏹️ Остановлен', 'highlight');
      saveState();
    },
    async status() {
      if (state.banned) { log('❌ Аккаунт заблокирован', 'error'); return; }
      const mine = await apiCall('balance/me', {});
      if (mine) state.pending = mine.pending || 0;
      log('📊 СТАТУС:', 'highlight');
      log(`  Режим: ${state.ecoMode?'🌿 ECO':'⚡ PRO'}`, 'info');
      log(`  Хешрейт: ${state.hashrate.toFixed(2)} MH/s`, 'info');
      log(`  Ожидает: ${state.pending.toFixed(2)} MIRA (server)`, 'highlight');
      log(`  Сложность: ${state.difficulty}`, 'info');
      log(`  Кошелёк: ${state.userWallet || 'НЕ НАСТРОЕН'}`, 'info');
    },
    setwallet(args) {
      if (!args || !args[0]) { log('❌ Укажите адрес', 'error'); return; }
      const addr = args[0];
      if (!/^[EU][Q][A-Za-z0-9_-]{46}$/.test(addr)) {
        log('❌ Невалидный адрес (EQ/UQ + 46 символов)', 'error');
        return;
      }
      state.userWallet = addr;
      localStorage.setItem('mira_user_wallet', addr);
      log(`✅ Сохранён: ${addr}`, 'success');
      saveState();
    },
    async claim() {
      if (state.banned) { log('❌ Аккаунт заблокирован', 'error'); return; }
      if (!state.userWallet) { log('❌ setwallet EQ... сначала', 'error'); return; }
      const mine = await apiCall('balance/me', {});
      const amount = mine?.pending || 0;
      if (amount < 0.1) { log('❌ Нет награды', 'error'); return; }

      const res = await apiCall('claim', { amount, wallet: state.userWallet });
      if (res?.success) {
        log(`✅ ЗАЯВКА: ${amount.toFixed(2)} MIRA`, 'success');
        log(`🔑 Код: ${res.code}`, 'highlight');
      } else if (res?.error) {
        log(`❌ ${res.error}`, 'error');
      }
    },
    wallet() {
      log('📬 АДРЕСА:', 'highlight');
      log(`  Холдер: ${CONFIG.holderAddress}`, 'info');
      log(`  Ваш: ${state.userWallet || 'НЕ НАСТРОЕН'}`, 'info');
    },
    eco() {
      state.ecoMode = !state.ecoMode;
      log(`🔋 Режим: ${state.ecoMode?'🌿 ECO':'⚡ PRO'}`, 'highlight');
      if (state.mining) startMiningLoop();
      saveState();
    },
    pool() { fetchPoolState(); },
    top() { fetchTop(); },
    ref() { log(`🔗 https://t.me/Mira_networks_bot?start=ref_${state.refCode}`, 'highlight'); },
    buy() { window.open(CONFIG.stonfiSwap, '_blank'); },
    stonfi() { window.open(CONFIG.stonfiPool, '_blank'); },
    clear() { while (output.firstChild) output.removeChild(output.firstChild); log('🧹 Очищено', 'muted'); },
    exit() { if (state.mining) commands.stop(); setTimeout(() => location.reload(), 500); }
  };

  function saveState() {
    try { localStorage.setItem('mira_terminal', JSON.stringify(state)); } catch(e) {}
  }
  function loadState() {
    try {
      const s = JSON.parse(localStorage.getItem('mira_terminal'));
      if (s) Object.assign(state, s);
      const w = localStorage.getItem('mira_user_wallet');
      if (w) state.userWallet = w;
    } catch(e) {}
  }

  input.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const cmd = input.value.trim();
    input.value = '';
    if (!cmd) return;
    log(`> ${cmd}`, 'muted');
    const parts = cmd.split(' ');
    const name = parts[0].toLowerCase();
    if (commands[name]) commands[name](parts.slice(1));
    else log(`❌ Команда не найдена`, 'error');
  });

  loadState();
  document.getElementById('pid').textContent = state.pid;

  log('⛏️ MIRA TERMINAL v9.1 — SECURITY PATCHED', 'highlight');
  log(`📡 API: ${API_BASE}`, 'muted');
  log(`🌿 Режим: ${state.ecoMode?'ECO':'PRO'}`, 'info');
  log(`🛡️ HMAC initData + server-side balance + PoW challenge`, 'success');
  if (state.userWallet) log(`📬 Кошелёк: ${state.userWallet}`, 'success');
  else log('⚠️ setwallet EQ... для вывода', 'error');
  log('💡 help — список команд', 'muted');

  fetchBalances();
  fetchPoolState();

  if (state.mining && !state.banned) {
    document.getElementById('status-indicator').className = 'status-led led-green';
    document.getElementById('status-text').textContent = 'MINING';
    startMiningLoop();
  }

  setInterval(saveState, 15000);
  document.addEventListener('click', () => input.focus());
  input.focus();
</script>
</body>
</html>
