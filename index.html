<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
/>

<title>⛏️ MIRA TERMINAL v10.0</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {

  background: #080b10;

  color: #00ff88;

  font-family: "Courier New", monospace;

  height: 100vh;

  padding: 10px;

  overflow: hidden;
}


#terminal {

  height: 100%;

  background: #0d1117;

  border: 1px solid #00ff8844;

  border-radius: 18px;

  padding: 14px;

  display: flex;

  flex-direction: column;

  box-shadow:
    0 0 30px #00ff8811,
    inset 0 0 30px #00ff8805;
}


.header {

  display: flex;

  justify-content: space-between;

  gap: 10px;

  flex-wrap: wrap;

  padding-bottom: 10px;

  border-bottom:
    1px solid #00ff8833;
}


.title {

  color: #00e676;

  font-size: 18px;

  letter-spacing: 1px;
}


.status-led {

  width: 12px;

  height: 12px;

  display: inline-block;

  border-radius: 50%;

  margin: 0 8px;
}


.led-red {

  background: #ff5252;

  box-shadow: 0 0 12px #ff5252;
}


.led-green {

  background: #00e676;

  box-shadow: 0 0 14px #00e676;
}


.muted {

  color: #718096;
}


#output {

  flex: 1;

  overflow-y: auto;

  padding-top: 10px;

  font-size: 14px;

  line-height: 1.6;

  word-break: break-word;
}


.log-entry {

  padding: 6px 0;

  border-bottom:
    1px solid #00ff8815;
}


.time {

  color: #64748b;

  margin-right: 8px;
}


.success {

  color: #00e676;
}


.error {

  color: #ff6b6b;
}


.info {

  color: #8ab4f8;
}


.highlight {

  color: #ffd166;
}


.muted-text {

  color: #7c8799;
}


.prompt-line {

  display: flex;

  align-items: center;

  gap: 8px;

  padding-top: 12px;

  margin-top: 10px;

  border-top:
    1px solid #00ff8833;
}


.prompt {

  color: #00ff88;

  font-weight: bold;

  font-size: 16px;

  white-space: nowrap;
}


#input {

  flex: 1;

  background: transparent;

  border: none;

  outline: none;

  color: #00ff88;

  font-family: "Courier New", monospace;

  font-size: 16px;

  min-width: 0;
}


#input::placeholder {

  color: #42604f;
}

</style>

</head>


<body>

<div id="terminal">


<div class="header">

<div>

<span class="title">
⛏️ MIRA TERMINAL v10.0 —
</span>

<span
id="status-indicator"
class="status-led led-red">
</span>

<span id="status-text">
OFFLINE
</span>

</div>


<div class="muted">

pid:
<span id="pid">----</span>

|

uptime:
<span id="uptime">0s</span>

</div>

</div>


<div id="output"></div>


<div class="prompt-line">

<span class="prompt">
mira@miner:~$
</span>

<input
id="input"
type="text"
autocomplete="off"
autocorrect="off"
autocapitalize="off"
spellcheck="false"
placeholder="help"
/>

</div>


</div>


<script>

// ============================================================
// MIRA TERMINAL v10.0
// ============================================================


// ВСТАВЬ СВОЙ CLOUDFLARE WORKER URL
const API_BASE =
  "https://mira.networkk.workers.dev";


// ============================================================
// TELEGRAM
// ============================================================

const TG = window.Telegram?.WebApp;


if (TG) {

  TG.ready();

  TG.expand();

} else {

  console.warn(
    "Telegram WebApp API unavailable"
  );
}


// ============================================================
// STATE
// ============================================================

const state = {

  mining: false,

  miningBusy: false,

  hashrate: 0,

  hashes: 0,

  blocks: 0,

  balance: 0,

  difficulty: 1,

  wallet: localStorage.getItem(
    "mira_wallet"
  ) || null,

  startTime: Date.now(),

  pid: Math.floor(
    Math.random() * 9000 + 1000
  ),

  interval: null
};


// ============================================================
// DOM
// ============================================================

const output =
  document.getElementById("output");

const input =
  document.getElementById("input");

const pid =
  document.getElementById("pid");

const uptime =
  document.getElementById("uptime");


// ============================================================
// LOG
// ============================================================

function log(message, type = "info") {

  const div =
    document.createElement("div");

  div.className = "log-entry";


  const time =
    new Date()
      .toLocaleTimeString();


  let className = "info";


  if (type === "success")
    className = "success";

  if (type === "error")
    className = "error";

  if (type === "highlight")
    className = "highlight";

  if (type === "muted")
    className = "muted-text";


  div.innerHTML = `
    <span class="time">
      [${time}]
    </span>

    <span class="${className}">
      ${escapeHtml(message)}
    </span>
  `;


  output.appendChild(div);

  output.scrollTop =
    output.scrollHeight;
}


function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


// ============================================================
// API
// ============================================================

async function apiCall(endpoint, data = {}) {

  try {

    const initData =
      TG?.initData || "";


    const response =
      await fetch(
        API_BASE + endpoint,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            ...data,

            initData
          })
        }
      );


    const json =
      await response.json();


    if (!response.ok) {

      console.error(
        "API error:",
        json
      );
    }


    return json;

  } catch (error) {

    console.error(error);

    log(
      "⚠️ API error: " +
      error.message,
      "error"
    );

    return null;
  }
}


// ============================================================
// SHA256
// ============================================================

async function sha256(text) {

  const data =
    new TextEncoder()
      .encode(text);


  const hash =
    await crypto.subtle.digest(
      "SHA-256",
      data
    );


  return [...new Uint8Array(hash)]

    .map(
      b =>
        b
          .toString(16)
          .padStart(2, "0")
    )

    .join("");
}


// ============================================================
// STATUS
// ============================================================

async function getStatus() {

  const data =
    await apiCall(
      "/balance/me"
    );


  if (!data) return;


  if (!data.success) {

    log(
      "🔒 " +
      (data.error || "Authorization failed"),
      "error"
    );

    return;
  }


  state.balance =
    Number(data.balance || 0);

  state.blocks =
    Number(data.blocks || 0);

  state.wallet =
    data.wallet ||
    state.wallet;


  log(
    "📊 МОЙ СТАТУС",
    "highlight"
  );

  log(
    "👤 Telegram ID: " +
    data.telegramId,
    "info"
  );

  log(
    "⛏️ Блоков: " +
    state.blocks,
    "info"
  );

  log(
    "⚖️ Баланс: " +
    state.balance.toFixed(2) +
    " MIRA",
    "highlight"
  );

  log(
    "📬 Кошелёк: " +
    (
      state.wallet ||
      "НЕ НАСТРОЕН"
    ),
    "info"
  );
}


// ============================================================
// POOL
// ============================================================

async function getPool() {

  const data =
    await apiCall("/pool");


  if (!data) return;


  if (!data.success) {

    log(
      "⚠️ Pool error: " +
      (data.error || "unknown"),
      "error"
    );

    return;
  }


  state.difficulty =
    Number(
      data.difficulty || 1
    );


  log(
    `⛏️ ПУЛ: блок #${data.blocks} | сложность ${data.difficulty}`,
    "info"
  );
}


// ============================================================
// WALLET
// ============================================================

async function setWallet(address) {

  const data =
    await apiCall(
      "/setwallet",
      {
        wallet: address
      }
    );


  if (!data) return;


  if (!data.success) {

    log(
      "❌ " +
      data.error,
      "error"
    );

    return;
  }


  state.wallet =
    data.wallet;


  localStorage.setItem(
    "mira_wallet",
    state.wallet
  );


  log(
    "✅ Кошелёк сохранён",
    "success"
  );
}


// ============================================================
// MINING
// ============================================================

async function mine() {

  if (
    state.miningBusy ||
    !state.mining
  ) return;


  state.miningBusy = true;


  try {

    const challenge =
      await apiCall(
        "/challenge"
      );


    if (
      !challenge ||
      !challenge.success
    ) {

      log(
        "⚠️ Challenge error: " +
        (
          challenge?.error ||
          "unknown"
        ),
        "error"
      );

      return;
    }


    const salt =
      challenge.salt;


    const difficulty =
      Number(
        challenge.difficulty || 1
      );


    const target =
      "0".repeat(difficulty);


    let nonce;

    let hash;

    let found = false;


    const start =
      performance.now();


    // Максимум попыток за один раунд
    const maxIterations = 30000;


    for (
      let i = 0;
      i < maxIterations;
      i++
    ) {

      if (!state.mining)
        break;


      nonce =
        crypto.randomUUID();


      hash =
        await sha256(
          salt + nonce
        );


      state.hashes++;


      if (
        hash.startsWith(target)
      ) {

        found = true;

        break;
      }
    }


    const elapsed =
      (
        performance.now() - start
      ) / 1000;


    if (elapsed > 0) {

      state.hashrate =
        (
          maxIterations /
          elapsed /
          1000
        );
    }


    if (!found) {

      log(
        "🔍 Nonce не найден",
        "muted"
      );

      return;
    }


    const result =
      await apiCall(
        "/submit",
        {
          nonce
        }
      );


    if (
      result?.success
    ) {

      state.blocks =
        result.block;

      state.balance =
        result.balance;

      state.difficulty =
        result.difficulty;


      log(
        `🎉 БЛОК #${result.block} | +${result.reward} MIRA`,
        "success"
      );


      log(
        `⚖️ Баланс: ${Number(result.balance).toFixed(2)} MIRA`,
        "highlight"
      );

    } else {

      log(
        "❌ " +
        (
          result?.error ||
          "Submit failed"
        ),
        "error"
      );
    }

  } catch (error) {

    log(
      "⚠️ Mining error: " +
      error.message,
      "error"
    );

  } finally {

    state.miningBusy = false;
  }
}


// ============================================================
// START / STOP
// ============================================================

function startMining() {

  if (state.mining) {

    log(
      "⚠️ Уже запущен",
      "error"
    );

    return;
  }


  state.mining = true;


  document
    .getElementById(
      "status-indicator"
    )
    .className =
      "status-led led-green";


  document
    .getElementById(
      "status-text"
    )
    .textContent =
      "MINING";


  log(
    "⛏️ Майнинг запущен",
    "success"
  );


  mine();


  state.interval =
    setInterval(
      mine,
      3000
    );
}


function stopMining() {

  state.mining = false;


  if (state.interval) {

    clearInterval(
      state.interval
    );

    state.interval = null;
  }


  document
    .getElementById(
      "status-indicator"
    )
    .className =
      "status-led led-red";


  document
    .getElementById(
      "status-text"
    )
    .textContent =
      "OFFLINE";


  log(
    "⏹️ Майнинг остановлен",
    "highlight"
  );
}


// ============================================================
// CLAIM
// ============================================================

async function claim() {

  if (!state.wallet) {

    log(
      "❌ Сначала: setwallet EQ...",
      "error"
    );

    return;
  }


  const data =
    await apiCall(
      "/balance/me"
    );


  if (
    !data?.success
  ) return;


  const amount =
    Number(data.balance || 0);


  const result =
    await apiCall(
      "/claim",
      {
        amount
      }
    );


  if (
    result?.success
  ) {

    state.balance = 0;


    log(
      "✅ Заявка создана",
      "success"
    );


    log(
      "🔑 Код: " +
      result.code,
      "highlight"
    );


    log(
      "⚖️ Amount: " +
      result.amount +
      " MIRA",
      "info"
    );

  } else {

    log(
      "❌ " +
      (
        result?.error ||
        "Claim failed"
      ),
      "error"
    );
  }
}


// ============================================================
// TOP
// ============================================================

async function getTop() {

  const data =
    await apiCall("/top");


  if (
    !data?.success
  ) {

    log(
      "❌ Top error",
      "error"
    );

    return;
  }


  log(
    "🏆 ТОП МАЙНЕРОВ:",
    "highlight"
  );


  if (!data.top.length) {

    log(
      "Пока нет майнеров",
      "muted"
    );

    return;
  }


  data.top.forEach(
    (miner, index) => {

      const medal =
        index === 0
          ? "🥇"
          : index === 1
          ? "🥈"
          : index === 2
          ? "🥉"
          : "#" + miner.rank;


      log(
        `${medal} ${miner.username} — ${miner.blocks} блоков`,
        "info"
      );
    }
  );
}


// ============================================================
// COMMANDS
// ============================================================

const commands = {

  help() {

    log(
      "📖 КОМАНДЫ:",
      "highlight"
    );


    [
      "start — начать",
      "stop — остановить",
      "status — мой статус",
      "pool — состояние пула",
      "top — топ майнеров",
      "wallet — показать кошелёк",
      "setwallet EQ... — установить TON кошелёк",
      "claim — создать заявку",
      "clear — очистить",
      "help — помощь"
    ]

    .forEach(
      command =>
        log(
          command,
          "info"
        )
    );
  },


  start() {
    startMining();
  },


  stop() {
    stopMining();
  },


  status() {
    getStatus();
  },


  pool() {
    getPool();
  },


  top() {
    getTop();
  },


  wallet() {

    log(
      "📬 " +
      (
        state.wallet ||
        "НЕ НАСТРОЕН"
      ),
      "highlight"
    );
  },


  setwallet(args) {

    if (!args[0]) {

      log(
        "❌ Использование: setwallet EQ...",
        "error"
      );

      return;
    }


    setWallet(
      args[0]
    );
  },


  claim() {
    claim();
  },


  clear() {

    output.innerHTML = "";

    log(
      "🧹 Терминал очищен",
      "muted"
    );
  }
};


// ============================================================
// INPUT
// ============================================================

input.addEventListener(
  "keydown",
  event => {

    if (
      event.key !== "Enter"
    ) return;


    const text =
      input.value.trim();


    input.value = "";


    if (!text) return;


    log(
      "> " + text,
      "muted"
    );


    const parts =
      text.split(/\s+/);


    const command =
      parts[0].toLowerCase();


    const args =
      parts.slice(1);


    if (
      commands[command]
    ) {

      commands[command](args);

    } else {

      log(
        "❌ Команда не найдена",
        "error"
      );
    }
  }
);


// ============================================================
// STARTUP
// ============================================================

pid.textContent =
  state.pid;


log(
  "⛏️ MIRA TERMINAL v10.0",
  "highlight"
);


log(
  "📡 API: " + API_BASE,
  "muted"
);


if (TG?.initData) {

  log(
    "🔐 Telegram WebApp авторизация активна",
    "success"
  );


  const user =
    TG.initDataUnsafe?.user;


  if (user?.id) {

    log(
      "👤 Telegram ID: " +
      user.id,
      "info"
    );
  }

} else {

  log(
    "⚠️ Откройте приложение через Telegram Bot",
    "error"
  );
}


log(
  "💡 help — список команд",
  "muted"
);


// ============================================================
// INITIAL API REQUESTS
// ============================================================

getStatus();

getPool();


// ============================================================
// UPTIME
// ============================================================

setInterval(
  () => {

    const seconds =
      Math.floor(
        (
          Date.now() -
          state.startTime
        ) / 1000
      );


    uptime.textContent =
      seconds + "s";

  },
  1000
);


document.addEventListener(
  "click",
  () => input.focus()
);


input.focus();

</script>

</body>

</html>
