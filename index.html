<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>MIRA TERMINAL</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
}

body {

  background: #090d14;

  color: #00ff88;

  font-family:
    "Courier New",
    monospace;

  padding: 10px;

  overflow: hidden;
}

#terminal {

  height: calc(100vh - 20px);

  background: #0d1117;

  border: 1px solid #00ff8840;

  border-radius: 18px;

  padding: 14px;

  display: flex;

  flex-direction: column;

  box-shadow:
    0 0 30px #00ff8810;

}

.header {

  display: flex;

  justify-content: space-between;

  gap: 10px;

  flex-wrap: wrap;

  padding-bottom: 10px;

  border-bottom:
    1px solid #00ff8830;

}

.title {

  color: #00e676;

  font-size: 16px;

}

.muted {

  color: #718096;

}

#output {

  flex: 1;

  overflow-y: auto;

  padding: 10px 0;

  font-size: 14px;

  line-height: 1.6;

  word-break: break-word;

}

#output::-webkit-scrollbar {

  width: 5px;

}

#output::-webkit-scrollbar-thumb {

  background: #00ff8850;

}

.log-entry {

  padding: 6px 2px;

  border-bottom:
    1px solid #00ff8815;

}

.time {

  color: #64748b;

  margin-right: 8px;

}

.success {

  color: #00e676;

}

.error {

  color: #ff6b6b;

}

.info {

  color: #8ab4f8;

}

.highlight {

  color: #ffd166;

}

.muted-text {

  color: #718096;

}

.status-led {

  display: inline-block;

  width: 11px;

  height: 11px;

  border-radius: 50%;

  margin-right: 6px;

}

.led-green {

  background: #00e676;

  box-shadow:
    0 0 12px #00e676;

}

.led-red {

  background: #ff5252;

  box-shadow:
    0 0 12px #ff5252;

}

.prompt-line {

  display: flex;

  align-items: center;

  gap: 8px;

  border-top:
    1px solid #00ff8830;

  padding-top: 10px;

}

.prompt {

  color: #00ff88;

  font-weight: bold;

  white-space: nowrap;

}

#input {

  width: 100%;

  flex: 1;

  background: transparent;

  border: none;

  outline: none;

  color: #00ff88;

  font-family: inherit;

  font-size: 15px;

}

</style>

</head>

<body>

<div id="terminal">

<div class="header">

<div class="title">

⛏️ MIRA TERMINAL v10.0 —

<span
  id="status-indicator"
  class="status-led led-red"
></span>

<span id="status-text">
OFFLINE
</span>

</div>

<div class="muted">

pid:
<span id="pid">-</span>

|

uptime:
<span id="uptime">0s</span>

</div>

</div>


<div id="output"></div>


<div class="prompt-line">

<span class="prompt">
mira@miner:~$
</span>

<input
  id="input"
  type="text"
  autocomplete="off"
  autocapitalize="off"
  spellcheck="false"
>

</div>

</div>


<script>

// ======================================================
// TELEGRAM
// ======================================================

const TG = window.Telegram?.WebApp;

if (TG) {

  TG.ready();

  TG.expand();

}


// ======================================================
// CONFIG
// ======================================================

const API_BASE =
  "https://mira.networkk.workers.dev";


// ======================================================
// STATE
// ======================================================

const state = {

  mining: false,

  miningBusy: false,

  ecoMode: true,

  hashrate: 0,

  blocks: 0,

  poolBlocks: 0,

  activeMiners: 0,

  lastGlobalBlock: 0,

  pending: 0,

  difficulty: 1,

  wallet: null,

  telegramId: null,

  authorized: false,

  startTime: Date.now(),

  pid: Math.floor(
    Math.random() * 9000 + 1000
  )

};


let miningTimer = null;


// ======================================================
// ELEMENTS
// ======================================================

const output =
  document.getElementById("output");

const input =
  document.getElementById("input");


// ======================================================
// LOG
// ======================================================

function log(
  message,
  type = "info"
) {

  const row =
    document.createElement("div");

  row.className =
    "log-entry";

  const time =
    new Date()
      .toLocaleTimeString();

  const timeNode = document.createElement("span");
  timeNode.className = "time";
  timeNode.textContent = `[${time}]`;

  const messageNode = document.createElement("span");
  messageNode.className = ["success", "error", "info", "highlight", "muted-text"].includes(type)
    ? type
    : "info";
  messageNode.textContent = String(message);

  row.append(timeNode, messageNode);

  output.appendChild(row);

  output.scrollTop =
    output.scrollHeight;

}


// ======================================================
// API
// ======================================================

async function api(
  endpoint,
  data = {}
) {

  try {

    const response =
      await fetch(
        `${API_BASE}/${endpoint}`,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              ...data,

              initData:
                TG?.initData || ""

            })

        }
      );

    const contentType = response.headers.get("content-type") || "";
    const result = contentType.includes("application/json")
      ? await response.json()
      : { success: false, error: "Сервер вернул некорректный ответ" };

    if (!response.ok) {

      log(
        `API ${response.status}: ${result.error || "error"}`,
        "error"
      );

    }

    return result;

  } catch (error) {

    log(
      `API connection error: ${error.message}`,
      "error"
    );

    return null;

  }

}


// ======================================================
// AUTH
// ======================================================

async function authenticate() {

  if (!TG) {

    log(
      "Откройте приложение через Telegram",
      "error"
    );

    return false;

  }

  if (!TG.initData) {

    log(
      "Telegram initData отсутствует",
      "error"
    );

    return false;

  }

  const result =
    await api("auth");

  if (!result?.success) {

    log(
      result?.error ||
      "Telegram authorization failed",
      "error"
    );

    return false;

  }

  state.telegramId =
    result.user?.id;

  state.authorized = true;

  log(
    "🔐 Telegram WebApp авторизация активна",
    "success"
  );

  log(
    `👤 Telegram ID: ${state.telegramId}`,
    "info"
  );

  return true;

}


// ======================================================
// LOAD BALANCE
// ======================================================

async function loadBalance() {

  const data =
    await api("balance/me");

  if (!data?.success) return;

  state.pending =
    Number(data.pending || 0);

  state.blocks =
    Number(data.blocks || 0);

  state.wallet =
    data.wallet || null;

}


// ======================================================
// LOAD POOL
// ======================================================

async function loadPool() {

  const data =
    await api("pool");

  if (!data?.success) return;

  state.difficulty =
    Number(data.difficulty || 1);

  state.poolBlocks =
    Number(data.blocks || 0);

}


// ======================================================
// STATUS
// ======================================================

async function showStatus() {

  await loadBalance();

  await loadPool();

  log(
    "📊 СТАТУС:",
    "highlight"
  );

  log(
    "Режим: 🌿 MOBILE — 1 SHA / 15 сек",
    "info"
  );

  log(
    `Статус: ${
      state.mining
        ? "MINING"
        : "OFFLINE"
    }`,
    state.mining
      ? "success"
      : "muted-text"
  );

  log(
    `Хешрейт: ${state.hashrate.toFixed(3)} MH/s`,
    "info"
  );

  log(
    `Баланс: ${state.pending.toFixed(4)} MIRA`,
    "highlight"
  );

  log(
    `Sizning bloklaringiz: ${state.blocks}`,
    "info"
  );

  log(
    `Umumiy pool bloklari: ${state.poolBlocks}`,
    "info"
  );

  log(
    `Сложность: ${state.difficulty}`,
    "info"
  );

  log(
    `Кошелёк: ${
      state.wallet ||
      "НЕ НАСТРОЕН"
    }`,
    "info"
  );

}


// ======================================================
// SHA256
// ======================================================

async function sha256(
  message
) {

  const encoder =
    new TextEncoder();

  const buffer =
    await crypto.subtle.digest(
      "SHA-256",
      encoder.encode(message)
    );

  return [...new Uint8Array(buffer)]
    .map(
      b =>
        b.toString(16)
          .padStart(2, "0")
    )
    .join("");

}

async function waitWhileMining(milliseconds) {

  const endsAt = Date.now() + milliseconds;

  while (state.mining && Date.now() < endsAt) {

    await new Promise(
      resolve => setTimeout(resolve, Math.min(250, endsAt - Date.now()))
    );

  }

  return state.mining;

}


// ======================================================
// MINE
// ======================================================

async function mineRound() {

  if (
    !state.mining ||
    state.miningBusy
  ) {
    return;
  }

  state.miningBusy = true;

  try {
    const result = await api("pool/heartbeat");

    if (!result?.success) {
      log(result?.error || "Pool connection error", "error");
      return;
    }

    state.poolBlocks = Number(result.height || 0);
    state.activeMiners = Number(result.activeMiners || 0);
    state.pending = Number(result.balance || state.pending);
    state.blocks = Number(result.userBlocks || state.blocks);

    if (result.latestBlock && result.latestBlock.number > state.lastGlobalBlock) {
      const block = result.latestBlock;
      state.lastGlobalBlock = block.number;
      const mine = String(block.minerId) === String(state.telegramId);
      const reward = mine
        ? block.finderReward + block.participantReward
        : block.participantReward;

      log(`🌐 BLOK #${block.number} | topuvchi: ${block.miner} | qatnashchilar: ${block.participants}`, "highlight");
      log(mine ? `🏆 Siz topdingiz: +${reward} MIRA` : `🌿 Faol qatnashuv: +${reward} MIRA`, "success");
    }


  } catch (error) {

    log(
      `Mine error: ${error.message}`,
      "error"
    );

  } finally {

    state.miningBusy =
      false;

  }

}


// ======================================================
// START
// ======================================================

function startMining() {

  if (!state.authorized) {

    log(
      "Сначала пройдите авторизацию через Telegram",
      "error"
    );

    return;

  }

  if (state.mining) {

    log(
      "Майнинг уже запущен",
      "error"
    );

    return;

  }

  state.mining = true;


  document
    .getElementById(
      "status-indicator"
    )
    .className =
      "status-led led-green";


  document
    .getElementById(
      "status-text"
    )
    .textContent =
      "MINING";


  log(
    "⛏️ Umumiy poolga qo‘shildingiz: blok har 30 soniyada",
    "success"
  );


  mineRound();


  miningTimer =
    setInterval(
      mineRound,
      10000
    );

}


// ======================================================
// STOP
// ======================================================

function stopMining() {

  if (!state.mining) return;

  state.mining = false;


  if (miningTimer) {

    clearInterval(
      miningTimer
    );

    miningTimer = null;

  }


  document
    .getElementById(
      "status-indicator"
    )
    .className =
      "status-led led-red";


  document
    .getElementById(
      "status-text"
    )
    .textContent =
      "OFFLINE";


  log(
    "⏹️ Майнинг остановлен",
    "highlight"
  );

}


// ======================================================
// TOP
// ======================================================

async function showTop() {

  const data =
    await api("top");

  if (!data?.success) return;


  log(
    "🏆 ТОП МАЙНЕРОВ:",
    "highlight"
  );


  if (!data.top?.length) {

    log(
      "Пока нет майнеров",
      "muted-text"
    );

    return;

  }


  data.top.forEach(
    (user, index) => {

      const medal =
        index === 0
          ? "🥇"
          : index === 1
          ? "🥈"
          : index === 2
          ? "🥉"
          : `#${index + 1}`;


      log(
        `${medal} ${
          user.name ||
          user.id
        } — ${user.blocks} блоков`,
        index < 3
          ? "highlight"
          : "info"
      );

    }
  );

}

async function showRecentBlocks() {

  const data = await api("blocks/recent");

  if (!data?.success) return;

  log("🌐 OXIRGI UMUMIY BLOKLAR:", "highlight");

  if (!data.blocks?.length) {
    log("Hali bloklar yo‘q", "muted-text");
    return;
  }

  data.blocks.forEach(block => {
    const time = new Date(block.createdAt).toLocaleTimeString();
    log(
      `#${block.number} — ${block.miner} | ${block.participants} mayner | topuvchi +${block.finderReward} | qatnashuvchi +${block.participantReward} MIRA | ${time}`,
      "info"
    );
  });

}


// ======================================================
// WALLET
// ======================================================

async function setWallet(
  args
) {

  const wallet =
    args.join(" ").trim();


  if (!wallet) {

    log(
      "Использование: setwallet EQ...",
      "error"
    );

    return;

  }


  const result =
    await api(
      "wallet",
      { wallet }
    );


  if (result?.success) {

    state.wallet =
      result.wallet;


    log(
      `📬 Кошелёк сохранён: ${result.wallet}`,
      "success"
    );

  } else {

    log(
      result?.error ||
      "Wallet error",
      "error"
    );

  }

}


// ======================================================
// CLAIM
// ======================================================

async function claim() {

  const result =
    await api("claim");


  if (result?.success) {

    state.pending = 0;


    log(
      `✅ Заявка создана`,
      "success"
    );


    log(
      `💰 ${result.amount} MIRA`,
      "highlight"
    );


    log(
      `🔑 ID: ${result.code}`,
      "info"
    );


  } else {

    log(
      result?.error ||
      "Claim error",
      "error"
    );

  }

}


// ======================================================
// HELP
// ======================================================

function help() {

  log(
    "КОМАНДЫ:",
    "highlight"
  );


  const commands = [

    "start — запустить",

    "stop — остановить",

    "status — статус",

    "pool — пул",

    "top — топ майнеров",

    "blocks — oxirgi umumiy bloklar",

    "wallet — показать кошелёк",

    "setwallet EQ... — сохранить кошелёк",

    "claim — создать заявку",

    "clear — очистить",

    "help — помощь"

  ];


  commands.forEach(
    command =>
      log(
        `  ${command}`,
        "info"
      )
  );

}


// ======================================================
// COMMANDS
// ======================================================

const commands = {

  help,

  start: startMining,

  stop: stopMining,

  status: showStatus,

  pool: async () => {

    await loadPool();

    log(
      `⛏️ ПУЛ | сложность ${state.difficulty}`,
      "info"
    );

  },

  top: showTop,

  blocks: showRecentBlocks,

  wallet: () => {

    log(
      `📬 ${
        state.wallet ||
        "Кошелёк не установлен"
      }`,
      "info"
    );

  },

  setwallet: setWallet,

  claim,

  eco: () => {

    log(
      "🌿 MOBILE rejim doim yoqilgan: 1 SHA / 15 soniya",
      "highlight"
    );

  },

  clear: () => {

    output.innerHTML = "";

  }

};


// ======================================================
// INPUT
// ======================================================

input.addEventListener(
  "keydown",
  async event => {

    if (
      event.key !== "Enter"
    ) return;


    const value =
      input.value.trim();


    input.value = "";


    if (!value) return;


    log(
      `> ${value}`,
      "muted-text"
    );


    const parts =
      value.split(/\s+/);


    const name =
      parts[0].toLowerCase();


    const args =
      parts.slice(1);


    if (!commands[name]) {

      log(
        "❌ Команда не найдена",
        "error"
      );

      return;

    }


    await commands[name](args);

  }
);


// ======================================================
// UPTIME
// ======================================================

setInterval(
  () => {

    const seconds =
      Math.floor(
        (
          Date.now() -
          state.startTime
        ) / 1000
      );


    document
      .getElementById("uptime")
      .textContent =
      `${seconds}s`;

  },
  1000
);


// ======================================================
// INIT
// ======================================================

async function init() {

  document
    .getElementById("pid")
    .textContent =
    state.pid;


  log(
    "⛏️ MIRA TERMINAL v10.0",
    "highlight"
  );


  log(
    `📡 API: ${API_BASE}`,
    "muted-text"
  );


  const authorized =
    await authenticate();


  if (!authorized) {

    log(
      "🔒 Авторизация не пройдена",
      "error"
    );

    return;

  }


  await loadBalance();

  await loadPool();


  log(
    `⚖️ Баланс: ${state.pending.toFixed(4)} MIRA`,
    "highlight"
  );


  log(
    `⛏️ ПУЛ | сложность ${state.difficulty}`,
    "info"
  );


  if (state.wallet) {

    log(
      `📬 Кошелёк: ${state.wallet}`,
      "success"
    );

  } else {

    log(
      "💡 Используйте setwallet EQ...",
      "muted-text"
    );

  }


  log(
    "💡 help — список команд",
    "muted-text"
  );

}


document.addEventListener(
  "click",
  () => input.focus()
);


init();

</script>

</body>
</html>
