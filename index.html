<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<title>⛏️ MIRA TERMINAL v9.3</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {

  background: #0a0c10;
  color: #00ff88;

  font-family:
    "Courier New",
    monospace;

  padding: 10px;

  height: 100vh;

  display: flex;

  flex-direction: column;
}

#terminal {

  background: #0d1117;

  border:
    1px solid #00ff8833;

  border-radius: 12px;

  padding: 14px;

  flex: 1;

  display: flex;

  flex-direction: column;

  overflow: hidden;

  box-shadow:
    0 0 40px #00ff8811;
}

.header {

  display: flex;

  justify-content: space-between;

  border-bottom:
    1px solid #00ff8833;

  padding-bottom: 8px;

  margin-bottom: 8px;

  flex-wrap: wrap;

  gap: 8px;
}

#output {

  flex: 1;

  overflow-y: auto;

  padding: 4px 0;

  font-size: 14px;

  line-height: 1.5;

  white-space: pre-wrap;

  word-break: break-word;
}

#output::-webkit-scrollbar {
  width: 6px;
}

#output::-webkit-scrollbar-thumb {
  background: #00ff8844;
}

.prompt-line {

  display: flex;

  align-items: center;

  gap: 8px;

  margin-top: 8px;

  border-top:
    1px solid #00ff8811;

  padding-top: 8px;
}

.prompt {

  color: #00ff88;

  font-weight: bold;

  white-space: nowrap;
}

#input {

  background: transparent;

  border: none;

  color: #00ff88;

  font-family:
    "Courier New",
    monospace;

  font-size: 14px;

  flex: 1;

  outline: none;
}

.log-entry {

  border-bottom:
    1px solid #00ff8811;

  padding: 5px 0;
}

.time {
  color: #667788;
  margin-right: 8px;
}

.highlight {
  color: #ffd740;
}

.error {
  color: #ff5252;
}

.success {
  color: #00e676;
}

.info {
  color: #64b5f6;
}

.muted {
  color: #8090a0;
}

.status-led {

  display: inline-block;

  width: 10px;
  height: 10px;

  border-radius: 50%;

  margin-right: 6px;
}

.led-green {

  background: #00e676;

  box-shadow:
    0 0 12px #00e676;
}

.led-red {

  background: #ff5252;

  box-shadow:
    0 0 12px #ff5252;
}

</style>

</head>

<body>

<div id="terminal">

  <div class="header">

    <span>

      ⛏️ MIRA TERMINAL v9.3 —

      <span
        id="status-indicator"
        class="status-led led-red"
      ></span>

      <span id="status-text">
        OFFLINE
      </span>

    </span>

    <span class="muted">

      pid:
      <span id="pid">-</span>

      |

      uptime:
      <span id="uptime">0s</span>

    </span>

  </div>

  <div id="output"></div>

  <div class="prompt-line">

    <span class="prompt">
      mira@miner:~$
    </span>

    <input
      type="text"
      id="input"
      autofocus
      spellcheck="false"
      autocomplete="off"
    >

  </div>

</div>

<script>

// ============================================================
// TELEGRAM
// ============================================================

const TG =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;


if (TG) {

  TG.ready();

  TG.expand();

}


// ============================================================
// CONFIG
// ============================================================

const API_BASE =
  "https://mira.networkk.workers.dev";


// ============================================================
// STATE
// ============================================================

const state = {

  mining: false,

  hashrate: 0,

  totalHashes: 0,

  blocks: 0,

  pending: 0,

  totalReward: 0,

  difficulty: 1,

  userWallet: null,

  startTime: Date.now(),

  pid:
    Math.floor(
      Math.random() * 9000 + 1000
    ),

  ecoMode:
    /Mobi|Android|iPhone|iPad/i
      .test(navigator.userAgent),

  banned: false

};


let miningInterval = null;

let isMiningNow = false;


// ============================================================
// ELEMENTS
// ============================================================

const output =
  document.getElementById("output");

const input =
  document.getElementById("input");


// ============================================================
// LOG
// ============================================================

function log(msg, type = "info") {

  const div =
    document.createElement("div");

  div.className =
    "log-entry";

  const time =
    new Date()
      .toLocaleTimeString();

  div.innerHTML =
    '<span class="time">[' +
    time +
    ']</span>' +
    '<span class="' +
    type +
    '">' +
    escapeHtml(String(msg)) +
    "</span>";

  output.appendChild(div);

  output.scrollTop =
    output.scrollHeight;

  if (
    output.children.length > 300
  ) {
    output.removeChild(
      output.firstChild
    );
  }
}


function escapeHtml(text) {

  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}


// ============================================================
// SHA256
// ============================================================

async function sha256(message) {

  const encoder =
    new TextEncoder();

  const buffer =
    await crypto.subtle.digest(
      "SHA-256",
      encoder.encode(message)
    );

  return Array.from(
    new Uint8Array(buffer)
  )
    .map(
      b =>
        b.toString(16)
          .padStart(2, "0")
    )
    .join("");
}


// ============================================================
// API
// ============================================================

async function apiCall(endpoint, data = {}) {

  try {

    const initData =
      TG ? TG.initData : "";

    if (!initData) {

      log(
        "🔒 Telegram initData отсутствует",
        "error"
      );

      return {
        success: false,
        error: "Откройте приложение через Telegram"
      };
    }

    const response =
      await fetch(
        API_BASE + "/" + endpoint,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              ...data,

              initData: initData

            })

        }
      );

    const result =
      await response.json();

    return result;

  } catch (error) {

    log(
      "⚠️ API error: " +
      error.message,
      "error"
    );

    return null;
  }
}


// ============================================================
// LOAD BALANCE
// ============================================================

async function fetchBalance() {

  const data =
    await apiCall(
      "balance/me"
    );

  if (!data) {
    return;
  }

  if (data.success === false) {

    log(
      "🔒 " +
      (data.error || "Ошибка авторизации"),
      "error"
    );

    return;
  }

  state.pending =
    Number(data.pending || 0);

  state.blocks =
    Number(data.blocks || 0);

  state.totalReward =
    Number(data.totalReward || 0);

  if (data.wallet) {
    state.userWallet =
      data.wallet;
  }

  log(
    "⚖️ Мой баланс: " +
    state.pending.toFixed(2) +
    " MIRA",
    "highlight"
  );
}


// ============================================================
// POOL
// ============================================================

async function fetchPoolState() {

  try {

    const response =
      await fetch(
        API_BASE + "/pool",
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body: "{}"
        }
      );

    const data =
      await response.json();

    if (data.success) {

      state.difficulty =
        Number(
          data.difficulty || 1
        );

      log(
        "⛏️ ПУЛ: блок #" +
        data.blocks +
        " | сложность " +
        data.difficulty,
        "info"
      );
    }

  } catch (error) {

    log(
      "⚠️ Pool error",
      "error"
    );
  }
}


// ============================================================
// TOP
// ============================================================

async function fetchTop() {

  const data =
    await apiCall("top");

  if (!data) {
    return;
  }

  if (data.success === false) {

    log(
      "❌ " + data.error,
      "error"
    );

    return;
  }

  log(
    "🏆 ТОП МАЙНЕРОВ:",
    "highlight"
  );

  if (
    !data.top ||
    !data.top.length
  ) {

    log(
      "Пока нет майнеров",
      "muted"
    );

    return;
  }

  data.top.forEach(
    function (item, index) {

      let medal =
        "#" + item.rank;

      if (index === 0) {
        medal = "🥇";
      }

      if (index === 1) {
        medal = "🥈";
      }

      if (index === 2) {
        medal = "🥉";
      }

      log(
        medal +
        " " +
        String(item.id)
          .substring(0, 10) +
        "... — " +
        item.blocks +
        " блоков",
        index < 3
          ? "highlight"
          : "info"
      );

    }
  );
}


// ============================================================
// MINE BLOCK
// ============================================================

async function mineBlock() {

  try {

    const challenge =
      await apiCall("challenge");

    if (
      !challenge ||
      !challenge.success ||
      !challenge.salt
    ) {

      log(
        "⚠️ Challenge: " +
        (
          challenge?.error ||
          "failed"
        ),
        "error"
      );

      return;
    }

    const salt =
      challenge.salt;

    const difficulty =
      Number(
        challenge.difficulty
      );

    state.difficulty =
      difficulty;


    const target =
      difficulty * 100000;

    const threshold =
      Math.floor(
        0xFFFFFFFF / target
      );


    let hashes = 0;

    let foundNonce = null;


    const start =
      performance.now();


    const maxIterations =
      state.ecoMode
        ? 500
        : 3000;


    for (
      let i = 0;
      i < maxIterations;
      i++
    ) {

      if (!state.mining) {
        break;
      }

      const nonce =
        salt +
        "_" +
        i +
        "_" +
        Date.now();

      const hash =
        await sha256(
          salt + nonce
        );

      hashes++;

      state.totalHashes++;

      const value =
        parseInt(
          hash.substring(0, 8),
          16
        );

      if (value < threshold) {

        foundNonce =
          nonce;

        break;
      }
    }


    const elapsed =
      (
        performance.now() -
        start
      ) / 1000;


    if (elapsed > 0) {

      state.hashrate =
        hashes / elapsed / 1000000;

    }


    if (!foundNonce) {

      log(
        "🔍 Nonce не найден",
        "muted"
      );

      return;
    }


    log(
      "🎯 Найден nonce, отправляем...",
      "highlight"
    );


    const result =
      await apiCall(
        "submit",
        {
          nonce: foundNonce,
          difficulty: difficulty
        }
      );


    if (
      result &&
      result.success
    ) {

      state.blocks =
        result.block;

      state.pending =
        Number(
          result.balance || 0
        );

      state.difficulty =
        Number(
          result.difficulty ||
          difficulty
        );

      log(
        "⛏️ БЛОК #" +
        state.blocks +
        " | +" +
        result.reward +
        " MIRA",
        "success"
      );

    } else if (result) {

      if (
        result.code ===
        "DIFF_MISMATCH"
      ) {

        state.difficulty =
          result.expected;

        log(
          "↻ Сложность обновлена",
          "muted"
        );

      } else {

        log(
          "❌ " +
          (
            result.error ||
            "Submit error"
          ),
          "error"
        );
      }
    }

  } catch (error) {

    log(
      "⚠️ Mine error: " +
      error.message,
      "error"
    );
  }
}


// ============================================================
// MINING LOOP
// ============================================================

function startMiningLoop() {

  if (miningInterval) {

    clearInterval(
      miningInterval
    );
  }


  const interval =
    state.ecoMode
      ? 4000
      : 2000;


  miningInterval =
    setInterval(
      async function () {

        if (
          !state.mining ||
          isMiningNow
        ) {
          return;
        }

        isMiningNow = true;

        try {

          await mineBlock();

        } finally {

          isMiningNow = false;

        }

      },
      interval
    );
}


// ============================================================
// COMMANDS
// ============================================================

const commands = {

  help() {

    log(
      "КОМАНДЫ:",
      "highlight"
    );

    [
      "start",
      "stop",
      "status",
      "claim",
      "wallet",
      "setwallet",
      "eco",
      "pool",
      "top",
      "clear",
      "exit"
    ]
      .forEach(
        command =>
          log(
            "  " + command,
            "info"
          )
      );
  },


  start() {

    if (state.mining) {

      log(
        "❌ Уже запущен",
        "error"
      );

      return;
    }

    state.mining = true;

    document
      .getElementById(
        "status-indicator"
      )
      .className =
        "status-led led-green";

    document
      .getElementById(
        "status-text"
      )
      .textContent =
        "MINING";

    log(
      "⛏️ Майнинг запущен (" +
      (
        state.ecoMode
          ? "ECO"
          : "PRO"
      ) +
      ")",
      "success"
    );

    startMiningLoop();
  },


  stop() {

    state.mining = false;

    document
      .getElementById(
        "status-indicator"
      )
      .className =
        "status-led led-red";

    document
      .getElementById(
        "status-text"
      )
      .textContent =
        "OFFLINE";

    if (miningInterval) {

      clearInterval(
        miningInterval
      );

      miningInterval = null;
    }

    log(
      "⏹️ Майнинг остановлен",
      "highlight"
    );
  },


  async status() {

    await fetchBalance();

    log(
      "📊 СТАТУС:",
      "highlight"
    );

    log(
      "🌿 Режим: " +
      (
        state.ecoMode
          ? "ECO"
          : "PRO"
      ),
      "info"
    );

    log(
      "⚡ Хешрейт: " +
      state.hashrate.toFixed(2) +
      " MH/s",
      "info"
    );

    log(
      "⚖️ Баланс: " +
      state.pending.toFixed(2) +
      " MIRA",
      "highlight"
    );

    log(
      "⛏️ Блоков: " +
      state.blocks,
      "info"
    );

    log(
      "📬 Кошелёк: " +
      (
        state.userWallet ||
        "НЕ НАСТРОЕН"
      ),
      "info"
    );
  },


  setwallet(args) {

    if (
      !args ||
      !args[0]
    ) {

      log(
        "Использование: setwallet EQ...",
        "error"
      );

      return;
    }


    const address =
      args[0].trim();


    if (
      !/^(EQ|UQ)[A-Za-z0-9_-]{46}$/
        .test(address)
    ) {

      log(
        "❌ Неверный TON адрес",
        "error"
      );

      return;
    }


    state.userWallet =
      address;

    localStorage.setItem(
      "mira_wallet",
      address
    );

    log(
      "✅ Кошелёк сохранён",
      "success"
    );
  },


  wallet() {

    log(
      "📬 Ваш кошелёк:",
      "highlight"
    );

    log(
      state.userWallet ||
      "НЕ НАСТРОЕН",
      "info"
    );
  },


  async claim() {

    if (!state.userWallet) {

      log(
        "❌ Сначала setwallet EQ...",
        "error"
      );

      return;
    }


    await fetchBalance();


    if (
      state.pending < 0.1
    ) {

      log(
        "❌ Недостаточно MIRA",
        "error"
      );

      return;
    }


    const result =
      await apiCall(
        "claim",
        {
          amount:
            state.pending,

          wallet:
            state.userWallet
        }
      );


    if (
      result &&
      result.success
    ) {

      state.pending =
        Number(
          result.balance || 0
        );

      log(
        "✅ Заявка создана",
        "success"
      );

      log(
        "🔑 ID: " +
        result.code,
        "highlight"
      );

    } else {

      log(
        "❌ " +
        (
          result?.error ||
          "Claim error"
        ),
        "error"
      );
    }
  },


  eco() {

    state.ecoMode =
      !state.ecoMode;

    log(
      "🔋 Режим: " +
      (
        state.ecoMode
          ? "🌿 ECO"
          : "⚡ PRO"
      ),
      "highlight"
    );

    if (state.mining) {
      startMiningLoop();
    }
  },


  pool() {
    fetchPoolState();
  },


  top() {
    fetchTop();
  },


  clear() {

    output.innerHTML = "";

    log(
      "🧹 Очищено",
      "muted"
    );
  },


  exit() {

    if (state.mining) {
      commands.stop();
    }

    location.reload();
  }

};


// ============================================================
// INPUT
// ============================================================

input.addEventListener(
  "keydown",
  function (event) {

    if (event.key !== "Enter") {
      return;
    }

    const command =
      input.value.trim();

    input.value = "";

    if (!command) {
      return;
    }

    log(
      "> " + command,
      "muted"
    );

    const parts =
      command.split(/\s+/);

    const name =
      parts[0].toLowerCase();

    const args =
      parts.slice(1);

    if (commands[name]) {

      commands[name](args);

    } else {

      log(
        "❌ Команда не найдена",
        "error"
      );
    }
  }
);


// ============================================================
// INIT
// ============================================================

document
  .getElementById("pid")
  .textContent =
    state.pid;


const savedWallet =
  localStorage.getItem(
    "mira_wallet"
  );

if (savedWallet) {
  state.userWallet =
    savedWallet;
}


log(
  "⛏️ MIRA TERMINAL v9.3",
  "highlight"
);

log(
  "📡 API: " + API_BASE,
  "muted"
);


if (!TG) {

  log(
    "❌ Telegram WebApp API не найден",
    "error"
  );

} else if (!TG.initData) {

  log(
    "❌ Telegram initData пустой",
    "error"
  );

  log(
    "🔒 Откройте Mini App через Telegram Bot",
    "error"
  );

} else {

  const user =
    TG.initDataUnsafe?.user;

  log(
    "🔓 Telegram WebApp авторизация активна",
    "success"
  );

  if (user) {

    log(
      "👤 Telegram ID: " +
      user.id,
      "info"
    );
  }
}


log(
  "💡 help — список команд",
  "muted"
);


// Загрузка данных

fetchBalance();

fetchPoolState();


// Uptime

setInterval(
  function () {

    document
      .getElementById("uptime")
      .textContent =
        Math.floor(
          (
            Date.now() -
            state.startTime
          ) / 1000
        ) + "s";

  },
  1000
);


// Focus

document.addEventListener(
  "click",
  function () {
    input.focus();
  }
);

input.focus();

</script>

</body>
</html>
