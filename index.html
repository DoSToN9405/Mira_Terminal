<script>

  // ==========================================================
  // TELEGRAM WEBAPP
  // ==========================================================

  const TG = window.Telegram?.WebApp;

  if (TG) {

    TG.ready();
    TG.expand();

  }


  // ==========================================================
  // CONFIG
  // ==========================================================

  const API_BASE =
    "https://mira.networkk.workers.dev";


  const CONFIG = {

    // TON address used for TON balance checking
    holderAddress:
      "UQBr9K-6-Sbu7Dk8ZOkIgQfdbmFbEpuuGRkmZa1IAzRu8HAb",

    // Optional STON.fi links
    stonfiSwap:
      "https://app.ston.fi/",

    stonfiPool:
      "https://app.ston.fi/"

  };


  // ==========================================================
  // STATE
  // ==========================================================

  const state = {

    mining: false,

    hashrate: 0,

    totalHashes: 0,

    blocks: 0,

    pending: 0,

    difficulty: 1,

    power: 0,

    userWallet: null,

    refCode:
      "MIRA" +
      Math.random()
        .toString(36)
        .substring(2, 8)
        .toUpperCase(),

    startTime: Date.now(),

    pid:
      Math.floor(
        Math.random() * 9000 + 1000
      ),

    ecoMode:
      /Mobi|Android|iPhone|iPad/i
        .test(navigator.userAgent),

    banned: false

  };


  // ==========================================================
  // VARIABLES
  // ==========================================================

  let miningInterval = null;

  let isMiningNow = false;


  const output =
    document.getElementById("output");

  const input =
    document.getElementById("input");


  // ==========================================================
  // LOG
  // ==========================================================

  function log(message, type = "info") {

    const div =
      document.createElement("div");

    div.className =
      "log-entry";


    const time =
      new Date()
        .toLocaleTimeString();


    const spanTime =
      document.createElement("span");

    spanTime.className =
      "time";

    spanTime.textContent =
      `[${time}] `;


    const spanMessage =
      document.createElement("span");

    spanMessage.className =
      type;

    // textContent protects against HTML injection
    spanMessage.textContent =
      message;


    div.appendChild(spanTime);

    div.appendChild(spanMessage);

    output.appendChild(div);


    output.scrollTop =
      output.scrollHeight;


    // Limit terminal history
    if (
      output.children.length > 300
    ) {

      output.removeChild(
        output.firstChild
      );

    }

  }


  // ==========================================================
  // SHA256
  // ==========================================================

  async function sha256(message) {

    const encoder =
      new TextEncoder();


    const buffer =
      await crypto.subtle.digest(

        "SHA-256",

        encoder.encode(message)

      );


    return [

      ...new Uint8Array(buffer)

    ]

      .map(

        b =>
          b
            .toString(16)
            .padStart(2, "0")

      )

      .join("");

  }


  // ==========================================================
  // API
  // ==========================================================

  async function apiCall(
    endpoint,
    data = {}
  ) {

    try {

      const initData =
        TG?.initData || "";


      const response =
        await fetch(

          `${API_BASE}/${endpoint}`,

          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json"

            },

            body:

              JSON.stringify({

                ...data,

                initData

              })

          }

        );


      let result;


      try {

        result =
          await response.json();

      } catch {

        result = {

          error:
            "Invalid server response"

        };

      }


      if (!response.ok) {

        if (
          response.status === 401
        ) {

          log(
            "🔐 Откройте приложение через Telegram Bot",
            "error"
          );

        }

        return result;

      }


      return result;


    } catch (error) {

      log(
        `⚠️ API error: ${error.message}`,
        "error"
      );

      return null;

    }

  }


  // ==========================================================
  // BALANCE
  // ==========================================================

  async function fetchBalances() {

    const data =
      await apiCall(
        "balance",
        {
          address:
            CONFIG.holderAddress
        }
      );


    if (data) {

      log(
        `💰 TON: ${data.ton || "0"}`,
        "info"
      );

    }


    const mine =
      await apiCall(
        "balance/me"
      );


    if (mine) {

      state.pending =
        Number(mine.pending || 0);


      log(
        `⚖️ Мой баланс: ${state.pending.toFixed(2)} MIRA`,
        "highlight"
      );

    }

  }


  // ==========================================================
  // POOL
  // ==========================================================

  async function fetchPoolState() {

    const data =
      await apiCall(
        "pool"
      );


    if (data) {

      state.difficulty =
        Number(
          data.difficulty || 1
        );


      log(

        `⛏️ ПУЛ: блок #${data.blocks || 0} | сложность ${state.difficulty}`,

        "info"

      );

    }

  }


  // ==========================================================
  // TOP
  // ==========================================================

  async function fetchTop() {

    const data =
      await apiCall(
        "top"
      );


    if (
      data &&
      Array.isArray(data.top)
    ) {

      log(
        "🏆 ТОП МАЙНЕРОВ:",
        "highlight"
      );


      if (!data.top.length) {

        log(
          "  Пока нет майнеров",
          "muted"
        );

        return;

      }


      data.top.forEach(

        (item, index) => {

          const medal =

            index === 0
              ? "🥇"

            : index === 1
              ? "🥈"

            : index === 2
              ? "🥉"

            : `#${item.rank}`;


          const shortId =
            String(item.id)
              .substring(0, 10);


          log(

            `  ${medal} ${shortId}... — ${item.blocks} блоков`,

            index < 3
              ? "highlight"
              : "info"

          );

        }

      );

    }

  }


  // ==========================================================
  // MINING
  // ==========================================================

  async function mineBlock() {

    try {

      const challenge =
        await apiCall(
          "challenge"
        );


      if (
        !challenge ||
        !challenge.salt
      ) {

        log(
          "⚠️ Не удалось получить challenge",
          "error"
        );

        return;

      }


      const salt =
        challenge.salt;


      const difficulty =
        Number(
          challenge.difficulty || 1
        );


      state.difficulty =
        difficulty;


      const target =
        difficulty * 100000;


      const threshold =
        Math.floor(
          0xFFFFFFFF / target
        );


      let hashes = 0;

      let foundNonce = null;


      const start =
        performance.now();


      const maxIterations =
        state.ecoMode
          ? 5000
          : 30000;


      for (
        let i = 0;

        i < maxIterations;

        i++
      ) {

        if (!state.mining) {
          break;
        }


        const nonce =
          `${salt}_${i}_${Date.now()}`;


        const hex =
          await sha256(
            salt + nonce
          );


        hashes++;

        state.totalHashes++;


        const hashValue =
          parseInt(
            hex.substring(0, 8),
            16
          );


        if (
          hashValue < threshold
        ) {

          foundNonce =
            nonce;

          break;

        }

      }


      const elapsed =
        Math.max(
          (performance.now() - start) / 1000,
          0.001
        );


      const currentHashrate =
        hashes / elapsed / 1000000;


      state.hashrate =

        state.hashrate * 0.6 +

        currentHashrate * 0.4;


      state.power =
        Math.floor(

          state.hashrate * 1.2 +

          (
            state.ecoMode
              ? 10
              : 30
          )

        );


      if (!foundNonce) {

        log(
          "🔍 Nonce не найден",
          "muted"
        );

        saveState();

        return;

      }


      const result =
        await apiCall(

          "submit",

          {

            nonce:
              foundNonce,

            difficulty

          }

        );


      if (result?.success) {

        state.blocks =
          Number(
            result.block || state.blocks
          );


        state.pending =
          Number(
            result.balance ||
            state.pending
          );


        state.difficulty =
          Number(
            result.difficulty ||
            difficulty
          );


        log(

          `⛏️ БЛОК #${state.blocks} | +${result.reward} MIRA | Сложность ${state.difficulty}`,

          "success"

        );

      }


      else if (result) {

        switch (
          result.code
        ) {

          case "DIFF_MISMATCH":

            state.difficulty =
              Number(
                result.expected ||
                difficulty
              );

            log(
              "↻ Сложность обновлена",
              "muted"
            );

            break;


          case "TOO_FAST":

            log(
              `⏳ ${result.error}`,
              "muted"
            );

            break;


          case "NO_CHALLENGE":

            log(
              "↻ Challenge истёк",
              "muted"
            );

            break;


          case "RATE_LIMIT":

            log(
              "⏳ Rate limit",
              "muted"
            );

            break;


          default:

            log(

              `❌ ${result.error || "Mining error"}`,

              "error"

            );

        }

      }


      updateUptime();

      saveState();


    } catch (error) {

      log(
        `⚠️ Mine error: ${error.message}`,
        "error"
      );

    }

  }


  // ==========================================================
  // START LOOP
  // ==========================================================

  function startMiningLoop() {

    if (
      miningInterval
    ) {

      clearInterval(
        miningInterval
      );

    }


    const interval =
      state.ecoMode
        ? 5000
        : 2000;


    miningInterval =
      setInterval(

        async () => {

          if (
            !state.mining ||
            isMiningNow
          ) {

            return;

          }


          isMiningNow = true;


          try {

            await mineBlock();

          } finally {

            isMiningNow = false;

          }

        },

        interval

      );


    // Start immediately
    if (!isMiningNow) {

      isMiningNow = true;

      mineBlock()

        .finally(() => {

          isMiningNow = false;

        });

    }

  }


  // ==========================================================
  // UPTIME
  // ==========================================================

  function updateUptime() {

    const seconds =
      Math.floor(

        (Date.now() -
          state.startTime)

        / 1000

      );


    document
      .getElementById("uptime")
      .textContent =
        `${seconds}s`;

  }


  setInterval(
    updateUptime,
    1000
  );


  // ==========================================================
  // SAVE / LOAD
  // ==========================================================

  function saveState() {

    try {

      const data = {

        mining:
          false,

        hashrate:
          state.hashrate,

        totalHashes:
          state.totalHashes,

        blocks:
          state.blocks,

        pending:
          state.pending,

        difficulty:
          state.difficulty,

        power:
          state.power,

        userWallet:
          state.userWallet,

        refCode:
          state.refCode,

        startTime:
          Date.now(),

        pid:
          state.pid,

        ecoMode:
          state.ecoMode

      };


      localStorage.setItem(

        "mira_terminal",

        JSON.stringify(data)

      );

    } catch {}

  }


  function loadState() {

    try {

      const raw =
        localStorage.getItem(
          "mira_terminal"
        );


      if (!raw) {
        return;
      }


      const saved =
        JSON.parse(raw);


      Object.assign(
        state,
        saved
      );


      // Never automatically restart mining
      state.mining = false;

      state.startTime =
        Date.now();


    } catch {}

  }


  // ==========================================================
  // COMMANDS
  // ==========================================================

  const commands = {


    help() {

      log(
        "КОМАНДЫ:",
        "highlight"
      );


      [

        "start",

        "stop",

        "status",

        "balance",

        "claim",

        "wallet",

        "setwallet EQ...",

        "eco",

        "pool",

        "top",

        "buy",

        "stonfi",

        "clear",

        "exit"

      ]

        .forEach(

          command =>

            log(
              `  ${command}`,
              "info"
            )

        );

    },


    start() {

      if (state.mining) {

        log(
          "⚠️ Майнинг уже запущен",
          "error"
        );

        return;

      }


      state.mining = true;


      document
        .getElementById(
          "status-indicator"
        )
        .className =
          "status-led led-green";


      document
        .getElementById(
          "status-text"
        )
        .textContent =
          "MINING";


      log(

        `⛏️ Майнинг запущен (${state.ecoMode ? "ECO" : "PRO"})`,

        "success"

      );


      startMiningLoop();

    },


    stop() {

      if (!state.mining) {

        log(
          "⚠️ Майнинг не запущен",
          "error"
        );

        return;

      }


      state.mining =
        false;


      if (miningInterval) {

        clearInterval(
          miningInterval
        );

        miningInterval =
          null;

      }


      document
        .getElementById(
          "status-indicator"
        )
        .className =
          "status-led led-red";


      document
        .getElementById(
          "status-text"
        )
        .textContent =
          "OFFLINE";


      log(
        "⏹️ Майнинг остановлен",
        "highlight"
      );


      saveState();

    },


    async status() {

      const mine =
        await apiCall(
          "balance/me"
        );


      if (mine) {

        state.pending =
          Number(
            mine.pending || 0
          );

      }


      log(
        "📊 СТАТУС:",
        "highlight"
      );


      log(

        `  Режим: ${state.ecoMode ? "🌿 ECO" : "⚡ PRO"}`,

        "info"

      );


      log(

        `  Хешрейт: ${state.hashrate.toFixed(3)} MH/s`,

        "info"

      );


      log(

        `  Хешей: ${state.totalHashes}`,

        "info"

      );


      log(

        `  Баланс: ${state.pending.toFixed(2)} MIRA`,

        "highlight"

      );


      log(

        `  Сложность: ${state.difficulty}`,

        "info"

      );


      log(

        `  Кошелёк: ${state.userWallet || "НЕ НАСТРОЕН"}`,

        "info"

      );

    },


    balance() {

      fetchBalances();

    },


    setwallet(args) {

      if (
        !args ||
        !args[0]
      ) {

        log(
          "❌ Используйте: setwallet EQ... или UQ...",
          "error"
        );

        return;

      }


      const address =
        args[0].trim();


      const valid =
        /^(EQ|UQ)[A-Za-z0-9_-]{46}$/
          .test(address);


      if (!valid) {

        log(
          "❌ Невалидный TON адрес",
          "error"
        );

        return;

      }


      state.userWallet =
        address;


      log(
        `✅ Кошелёк сохранён: ${address}`,
        "success"
      );


      saveState();

    },


    wallet() {

      log(
        "📬 ВАШ КОШЕЛЁК:",
        "highlight"
      );


      log(

        state.userWallet ||
        "НЕ НАСТРОЕН",

        state.userWallet
          ? "success"
          : "error"

      );

    },


    async claim() {

      if (
        !state.userWallet
      ) {

        log(
          "❌ Сначала используйте setwallet EQ... или UQ...",
          "error"
        );

        return;

      }


      const mine =
        await apiCall(
          "balance/me"
        );


      const amount =
        Number(
          mine?.pending || 0
        );


      if (amount < 0.1) {

        log(
          "❌ Недостаточно MIRA",
          "error"
        );

        return;

      }


      log(
        "⏳ Создание заявки...",
        "muted"
      );


      const result =
        await apiCall(

          "claim",

          {

            amount,

            wallet:
              state.userWallet

          }

        );


      if (result?.success) {

        state.pending =
          Number(
            result.balance || 0
          );


        log(

          `✅ ЗАЯВКА СОЗДАНА: ${amount.toFixed(2)} MIRA`,

          "success"

        );


        log(

          `🔑 Код: ${result.code}`,

          "highlight"

        );


      } else {

        log(

          `❌ ${result?.error || "Claim error"}`,

          "error"

        );

      }

    },


    eco() {

      state.ecoMode =
        !state.ecoMode;


      log(

        `🔋 Режим изменён: ${state.ecoMode ? "🌿 ECO" : "⚡ PRO"}`,

        "highlight"

      );


      if (state.mining) {

        startMiningLoop();

      }


      saveState();

    },


    pool() {

      fetchPoolState();

    },


    top() {

      fetchTop();

    },


    buy() {

      window.open(
        CONFIG.stonfiSwap,
        "_blank"
      );

    },


    stonfi() {

      window.open(
        CONFIG.stonfiPool,
        "_blank"
      );

    },


    clear() {

      output.innerHTML = "";

      log(
        "🧹 Терминал очищен",
        "muted"
      );

    },


    exit() {

      if (state.mining) {

        commands.stop();

      }


      setTimeout(
        () => location.reload(),
        300
      );

    }

  };


  // ==========================================================
  // INPUT
  // ==========================================================

  input.addEventListener(
    "keydown",

    event => {

      if (
        event.key !== "Enter"
      ) {

        return;

      }


      const command =
        input.value.trim();


      input.value =
        "";


      if (!command) {
        return;
      }


      log(
        `> ${command}`,
        "muted"
      );


      const parts =
        command.split(/\s+/);


      const name =
        parts[0].toLowerCase();


      const args =
        parts.slice(1);


      if (
        commands[name]
      ) {

        commands[name](args);

      } else {

        log(
          "❌ Команда не найдена. Используйте help",
          "error"
        );

      }

    }

  );


  // ==========================================================
  // INIT
  // ==========================================================

  loadState();


  document
    .getElementById("pid")
    .textContent =
      state.pid;


  updateUptime();


  log(
    "⛏️ MIRA TERMINAL v9.2 — SECURITY PATCHED",
    "highlight"
  );


  log(
    `📡 API: ${API_BASE}`,
    "muted"
  );


  log(

    `🌿 Режим: ${state.ecoMode ? "ECO" : "PRO"}`,

    "info"

  );


  if (TG?.initData) {

    log(
      "🔐 Telegram WebApp авторизация активна",
      "success"
    );

  } else {

    log(
